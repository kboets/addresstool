name: Deploy to release branches
on:
  push:
    branches:
      - release/**
    paths:
      - addresstool-api/**
      - addresstool-frontend/**
      - .github/workflows/deploy.yml

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: addresstool-api/
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build with Maven
        run: mvn -B -ntp clean verify


  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: addresstool-frontend/
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build frontend Docker image
        run: |
          docker build -t kubo1601/addresstool-frontend:${{ github.run_number }} \
                       -t kubo1601/addresstool-frontend:latest .

      - name: Push Docker image
        run: |
          docker push kubo1601/addresstool-frontend:${{ github.run_number }}
          docker push kubo1601/addresstool-frontend:latest

      - name: Cleanup old frontend Docker Hub tags
        shell: bash
        run: |
          set -euo pipefail

          REPO="kubo1601/addresstool-frontend"
          KEEP_COUNT=2

          TOKEN=$(curl -s -X POST "https://hub.docker.com/v2/users/login/" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"${{ secrets.DOCKERHUB_USERNAME }}\",\"password\":\"${{ secrets.DOCKERHUB_TOKEN }}\"}" \
            | jq -r .token)

          TAGS=$(curl -s "https://hub.docker.com/v2/repositories/${REPO}/tags?page_size=100" \
            -H "Authorization: Bearer ${TOKEN}" \
            | jq -r '.results[].name')

          TO_DELETE=$(echo "${TAGS}" \
            | grep -E '^[0-9]+$' \
            | sort -nr \
            | tail -n +$((KEEP_COUNT + 1)))

          if [ -z "${TO_DELETE}" ]; then
            echo "No old frontend tags to delete."
            exit 0
          fi

          echo "Deleting frontend tags:"
          echo "${TO_DELETE}"

          for TAG in ${TO_DELETE}; do
            curl -s -o /dev/null -w "%{http_code}" -X DELETE \
              "https://hub.docker.com/v2/repositories/${REPO}/tags/${TAG}/" \
              -H "Authorization: Bearer ${TOKEN}"
            echo " Deleted ${REPO}:${TAG}"
          done

  bump-version:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./addresstool-api
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Read current version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_VERSION=$(./mvnw -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)
          echo "current_version=${CURRENT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Bump patch version
        id: bump
        shell: bash
        run: |
          set -euo pipefail

          CURRENT_VERSION="${{ steps.version.outputs.current_version }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${CURRENT_VERSION}"
          NEXT_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"

          echo "next_version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"

          ./mvnw -B -ntp versions:set \
            -DnewVersion="${NEXT_VERSION}" \
            -DgenerateBackupPoms=false

      - name: Commit version bump
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- pom.xml; then
            echo "No version change to commit."
            exit 0
          fi

          git add pom.xml
          git commit -m "chore: bump Maven version to ${{ steps.bump.outputs.next_version }}"
          git push

  bump-version:
    needs: [ backend, frontend ]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./addresstool-api
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # This token is the key to bypassing branch protection
          token: ${{ secrets.GH_PAT }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Read current version
        id: version
        shell: bash
        run: |
          CURRENT_VERSION=$(./mvnw -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)
          echo "current_version=${CURRENT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Bump patch version
        id: bump
        shell: bash
        run: |
          CURRENT_VERSION="${{ steps.version.outputs.current_version }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${CURRENT_VERSION}"
          NEXT_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "next_version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"

          ./mvnw -B -ntp versions:set -DnewVersion="${NEXT_VERSION}" -DgenerateBackupPoms=false

      - name: Commit version bump
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add pom.xml
          # [skip ci] prevents this commit from starting the workflow all over again
          git commit -m "chore: bump Maven version to ${{ steps.bump.outputs.next_version }} [skip ci]"
          git push
