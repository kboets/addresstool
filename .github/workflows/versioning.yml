name: Update Version
on:
  push:
    branches:
      - release/*

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./addresstool-api
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # No token needed here; it uses GITHUB_TOKEN by default

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Read current version
        id: version
        run: |
          CURRENT_VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          echo "current_version=${CURRENT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Bump patch version
        id: bump
        run: |
          CURRENT_VERSION="${{ steps.version.outputs.current_version }}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${CURRENT_VERSION}"
          NEXT_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "next_version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"

          mvn -B versions:set -DnewVersion="${NEXT_VERSION}" -DgenerateBackupPoms=false

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- pom.xml; then
            echo "No version change to commit."
            exit 0
          fi

          git add pom.xml
          git commit -m "chore: bump Maven version to ${{ steps.bump.outputs.next_version }} [skip ci]"
          git push
