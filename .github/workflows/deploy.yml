name: Deploy
on:
  push:
    branches:
      - master
    paths:
      - 'addresstool-api/**'
      - 'addresstool-frontend/**'
      - '.github/workflows/deploy.yml'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Get Maven Version
        id: meta
        run: |
          cd addresstool-api
          V=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$V" >> $GITHUB_OUTPUT

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Images
        run: |
          VERSION=${{ steps.meta.outputs.version }}
          
          # API
          docker build -t kubo1601/addresstool-api:$VERSION -t kubo1601/addresstool-api:latest ./addresstool-api
          docker push kubo1601/addresstool-api:$VERSION
          docker push kubo1601/addresstool-api:latest
          
          # Frontend
          docker build -t kubo1601/addresstool-frontend:$VERSION -t kubo1601/addresstool-frontend:latest ./addresstool-frontend
          docker push kubo1601/addresstool-frontend:$VERSION
          docker push kubo1601/addresstool-frontend:latest

      - name: Cleanup Old Tags
        shell: bash
        run: |
          set -euo pipefail
          KEEP_COUNT=2
          REPOS=("kubo1601/addresstool-api" "kubo1601/addresstool-frontend")

          # Get Token once
          TOKEN=$(curl -s -X POST "https://hub.docker.com/v2/users/login/" \
            -H "Content-Type: application/json" \
            -d "{\"username\":\"${{ secrets.DOCKERHUB_USERNAME }}\",\"password\":\"${{ secrets.DOCKERHUB_TOKEN }}\"}" \
            | jq -r .token)

          for REPO in "${REPOS[@]}"; do
            echo "Checking repo: $REPO"
          
            # Fetch all tags, filter for semantic versions (x.y.z), sort them, and keep newest
            TAGS=$(curl -s "https://hub.docker.com/v2/repositories/${REPO}/tags?page_size=100" \
              -H "Authorization: Bearer ${TOKEN}" \
              | jq -r '.results[].name')

            # We only want to delete tags that match our versioning pattern (e.g. 1.2.0)
            # This avoids accidentally deleting 'latest'
            TO_DELETE=$(echo "${TAGS}" \
              | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -Vr \
              | tail -n +$((KEEP_COUNT + 1)))

            if [ -z "${TO_DELETE}" ]; then
              echo "  No old tags to delete for $REPO."
              continue
            fi

            for TAG in ${TO_DELETE}; do
              curl -s -o /dev/null -w "%{http_code}" -X DELETE \
                "https://hub.docker.com/v2/repositories/${REPO}/tags/${TAG}/" \
                -H "Authorization: Bearer ${TOKEN}"
              echo "  Deleted ${REPO}:${TAG}"
            done
          done
