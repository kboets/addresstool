name: Addresstool workflow
on:
  pull_request:
    branches:
     - master
    paths:
      - addresstool-api/**
      - addresstool-frontend/**
      - .github/workflows/build.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./addresstool-api
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Calculate next Maven version
        shell: bash
        run: |
            set -euo pipefail
            
            BRANCH_NAME="${{ github.head_ref }}"
            CURRENT_VERSION=$(./mvnw -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)
            
            IFS='.' read -r MAJOR MINOR PATCH <<< "${CURRENT_VERSION}"
            
            case "${BRANCH_NAME}" in
              feature/*)
                MINOR=$((MINOR + 1))
                PATCH=0
                ;;
              bugfix/*)
                PATCH=$((PATCH + 1))
                ;;
              *)
                echo "No version bump for branch ${BRANCH_NAME}"
                exit 0
                ;;
            esac
            
            NEXT_VERSION="${MAJOR}.${MINOR}.${PATCH}"
            echo "Current version: ${CURRENT_VERSION}"
            echo "Next version: ${NEXT_VERSION}"

      - name: maven clean verify
        run: mvn -B -ntp clean verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./addresstool-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: ./addresstool-frontend/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build frontend
        run: yarn build
