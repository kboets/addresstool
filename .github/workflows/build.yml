name: Test and build Workflow
on:
  pull_request:
    branches:
     - master
     - release/*
    paths:
      - addresstool-api/**
      - addresstool-frontend/**
      - .github/workflows/build.yml

  push:
    branches:
      - feature/*
      - bugfix/*

jobs:

  backend-unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./addresstool-api
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Unit tests
        run: mvn -B -ntp test

  backend-integration-tests:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v6

        - name: Setup Java
          uses: actions/setup-java@v5
          with:
            distribution: 'temurin'
            java-version: '25'

        - name: Integration tests
          working-directory: ./addresstool-api
          run: mvn -B -ntp failsafe:integration-test failsafe:verify

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./addresstool-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: ./addresstool-frontend/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build frontend
        run: yarn build
