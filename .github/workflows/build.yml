name: Addresstool workflow
on:
  pull_request:
    branches:
     - master
    paths:
      - addresstool-api/**
      - addresstool-frontend/**
      - .github/workflows/build.yml

permissions:
  contents: write
  pull-requests: write


jobs:

  versioning:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    defaults:
      run:
        working-directory: ./addresstool-api
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Determine & Apply Bump
        id: bump
        run: |
          # 1. Check if the last commit was already a bump to prevent loops
          LAST_COMMIT_MSG=$(git log -1 --pretty=%B)
          if [[ "$LAST_COMMIT_MSG" == "chore: bump version"* ]]; then
            echo "Version already bumped. Skipping Maven update."
            echo "skipped=true" >> $GITHUB_OUTPUT
          else
            # 2. Perform the actual bump logic
            BRANCH="${{ github.head_ref }}"
            if [[ $BRANCH == feature/* ]]; then
              mvn build-helper:parse-version versions:set -DnewVersion=\${parsedVersion.majorVersion}.\${parsedVersion.nextMinorVersion}.0 versions:commit
            elif [[ $BRANCH == bugfix/* ]]; then
              mvn build-helper:parse-version versions:set -DnewVersion=\${parsedVersion.majorVersion}.\${parsedVersion.minorVersion}.\${parsedVersion.nextIncrementalVersion} versions:commit
            fi
            echo "skipped=false" >> $GITHUB_OUTPUT
          fi

      - name: Get Version
        id: get_version
        run: echo "version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_OUTPUT

      - name: Persist to PR Branch
        # Only run this if we didn't just skip the bump
        if: steps.bump.outputs.skipped == 'false'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if git commit -am "chore: bump version to ${{ steps.get_version.outputs.version }}"; then
            git push
          else
            echo "No changes to commit."
          fi  


  backend:
    needs: versioning
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./addresstool-api
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: maven clean verify
        run: mvn -B -ntp clean verify

  frontend:
    needs: versioning
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./addresstool-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
          cache-dependency-path: ./addresstool-frontend/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build frontend
        run: yarn build
